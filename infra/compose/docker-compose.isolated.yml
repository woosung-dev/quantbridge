# 로컬 포트 격리 + isolated 한정 worker auto-rebuild (BL-181, Sprint 38)
# 다른 웹앱과 병렬 실행 시 host port 만 변경. 컨테이너 내부 포트(5432/6379)는 그대로 유지.
#
# 사용법:
#   make up-isolated         (port 격리만)
#   make up-isolated-watch   (port 격리 + worker/ws-stream/beat 가 src 변경 시 자동 reload)
#
# `!override` tag (Compose Spec, docker compose v2.24+) — list 키 (ports/command/volumes) 를
# append 가 아니라 완전 대체. base 의 command/ports 와 충돌하지 않도록 명시.
#
# BL-181 — backend-worker / backend-ws-stream / backend-beat 3 서비스에 한해
# `./backend/src` host 디렉터리를 `:ro` bind-mount 하고 watchfiles wrapper 로 celery 를 감싼다.
# host src 가 SoT 이므로 `:ro` 안전. 패키지 추가는 image rebuild 가 의무 (별도 ADR).
#
# WARNING: base mode (`make up`) 와 isolated mode 동시 운영 시 `quantbridge-*` container_name
# 충돌 발생. base 와 isolated 는 mutually exclusive (ADR docs/decisions/019-worker-auto-rebuild.md).

services:
  # ★host 인터페이스를 loopback 으로 고정한다. base 의 `"5432:5432"` 는 `0.0.0.0` 바인딩이라
  # 공개 VM(클라우드 소크)에서 방화벽 규칙 하나만 어긋나도 DB/redis 가 인터넷에 노출된다.
  # 접근 경로는 그대로다 — `make be-isolated` 도 게이트 분류기도 `localhost:5433` 으로 붙는다.
  db:
    ports: !override
      - "127.0.0.1:5433:5432"

  redis:
    ports: !override
      - "127.0.0.1:6380:6379"

  backend-worker:
    volumes: !override
      - ./backend/src:/app/src:ro
      - ./backend/.metrics:/metrics
    command: !override
      - "uv"
      - "run"
      - "watchfiles"
      - "--filter"
      - "python"
      - "celery -A src.tasks.celery_app worker --loglevel=info --pool=prefork --concurrency=2"
      - "/app/src"

  backend-ws-stream:
    volumes: !override
      - ./backend/src:/app/src:ro
      - ./backend/.metrics:/metrics
    command: !override
      - "uv"
      - "run"
      - "watchfiles"
      - "--filter"
      - "python"
      - "celery -A src.tasks.celery_app worker --loglevel=info --pool=prefork --concurrency=3 --queues=ws_stream"
      - "/app/src"

  # optimizer-heavy 도 같은 취급 — 빠져 있으면 이 컨테이너만 baked image 에 고정돼
  # 다른 3 워커와 코드 세대가 갈린다(§7.2 가 막으려는 stale worker 상황 그 자체).
  backend-optimizer-heavy:
    volumes: !override
      - ./backend/src:/app/src:ro
      - ./backend/.metrics:/metrics
    command: !override
      - "uv"
      - "run"
      - "watchfiles"
      - "--filter"
      - "python"
      - "celery -A src.tasks.celery_app worker -Q optimizer_heavy --pool=prefork --concurrency=1 --loglevel=info"
      - "/app/src"

  backend-beat:
    volumes: !override
      - ./backend/src:/app/src:ro
      - ./backend/.metrics:/metrics
      - beat-data:/data
    command: !override
      - "uv"
      - "run"
      - "watchfiles"
      - "--filter"
      - "python"
      - "celery -A src.tasks.celery_app beat --loglevel=info --schedule=/data/celerybeat-schedule"
      - "/app/src"
