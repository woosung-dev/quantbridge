# QuantBridge — 로컬 개발 환경
# Phase 0 Session 1 (ADR-002)
# 실행: docker compose up -d

services:
  # PostgreSQL + TimescaleDB extension (단일 인스턴스)
  # OHLCV 시계열은 hypertable로, 일반 테이블은 public 스키마로 분리 운영
  db:
    image: timescale/timescaledb:2.14.2-pg15
    container_name: quantbridge-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quantbridge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-quantbridge}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./infra/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-quantbridge} -d ${POSTGRES_DB:-quantbridge}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - quantbridge

  # Redis — Celery 브로커 + 결과 백엔드 + 분산 락/rate-limit
  # DB 1: Celery broker, DB 2: Celery result backend, DB 3: 분산 락 + rate limit
  #
  # ★★2026-08-15 surface-truth (S4) — `--maxmemory-policy` 를 `allkeys-lru` 에서
  #   `noeviction` 으로 바꿨다. 종전 설정은 **큐 메시지와 분산 락을 조용히 지울 수 있었다.**
  #   `maxmemory-policy` 는 **인스턴스 전역**이라 논리 DB 는 eviction 대상 선정에 **관여하지
  #   않는다** — 「DB 를 나눴으니 격리된다」는 문장이 세 곳에 있었고 전부 거짓이었다
  #   (`.env.example` · `docker-compose-guide.md` · 이 주석).
  #   `task_acks_late=True` 여도 **broker 에서 메시지가 사라지면 복구 경로가 없고**,
  #   `ws:lease` 가 사라지면 `_ws_lease.py` 가 「correctness fallback 없음」이라 적어 둔
  #   상태가 된다. ⇒ 지우느니 **쓰기를 거부**하는 쪽이 옳다.
  #   ★대가: OOM 이면 쓰기가 `OOM command not allowed` 로 실패한다.
  #   ★★**2026-08-15 적대 리뷰 정정** — 종전 주석은 「그 실패는 조용하지 않다 —
  #   `common/redis_client.py` 의 healthcheck 가 SET+GET+DEL 왕복이라 잡는다」고 적었고
  #   **그것은 거짓이었다.** 그 왕복은 **lifespan startup 1회**뿐이고, 그 뒤로 이 compose
  #   healthcheck 와 `/healthz` 는 **PING 만** 한다. PING 은 OOM 에서도 PONG 이므로 기동 후에
  #   발생한 OOM 은 「정상」으로 관측되고 `QbRedisLockPoolUnhealthy` 도 발화하지 않았다.
  #   ⇒ 아래 healthcheck 를 **쓰기 프로브**로 바꿨다(SETEX + DEL). 이제 컨테이너 healthcheck 가
  #   10초마다 실제 쓰기 가능성을 잰다. `/healthz` 축은 아직 PING 이다 — [BL-760].
  #   **쓰기 거부를 복구 경로로 오인하지 마라.**
  #   ★DB 0(캐시)은 **소비자가 0건**이라 이 인스턴스에서 뺐다(2026-08-15 실측:
  #   `settings.redis_url` 참조 `src/` 전체 0건). 캐시 소비자가 실제로 생기면 그때
  #   **별도 인스턴스**에 LRU 로 두어라 — 같은 인스턴스에 섞으면 이 결함이 그대로 돌아온다.
  #
  # ★`--auto-aof-rewrite-min-size 8mb` — [BL-594]. redis 기본값은 64mb 이고, rewrite 는
  #   **크기 조건과 증가율 조건을 둘 다** 넘어야 발동한다. base RDB 가 작으면(실측 88바이트)
  #   증가율은 늘 만족하므로 **크기 조건만 남는다** — 그래서 incr 파일이 64MB 에 닿을 때까지
  #   한 번도 rewrite 되지 않는다(실측: 10MB 를 넣어도 `aof_rewrites:0`). 프로덕션의 incr 이
  #   6일 동안 35.6MB 로 자라 그중 86.6% 가 판독 불가가 된 채 재기동 불능이었던 경로다.
  #   rewrite 는 메모리에서 base 를 새로 쓰고 **낡은 incr 파일을 지운다** — 즉 손상된 incr 을
  #   폐기한다(실측: 손상 주입 → rewrite → 재기동 성공). 8mb 면 노출 창이 35.6MB → ~8MB 로
  #   줄고, 관측된 쓰기량(~6MB/일) 기준 하루에 한 번꼴로 낡은 incr 이 폐기된다.
  #   ★`appendfsync`(기본 everysec)와 `stop_grace_period` 는 **기각**했다 — 실측 근거는
  #   `docs/backlog.md` [BL-594].
  redis:
    image: redis:7-alpine
    container_name: quantbridge-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --auto-aof-rewrite-min-size 8mb --maxmemory 512mb --maxmemory-policy noeviction
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      # ★PING 이 아니라 **쓰기 프로브**다 (2026-08-15 적대 리뷰). `noeviction` 아래에서
      #   OOM 이 나면 읽기는 되고 쓰기만 거부되는데, PING 은 그때도 PONG 을 낸다.
      #   `SET ... EX 5` 가 `OOM command not allowed` 로 실패하면 rc≠0 → unhealthy.
      #   키는 짧은 TTL 로 자멸하고 DEL 로 즉시 회수한다(고아 키 방지).
      test:
        [
          "CMD-SHELL",
          "redis-cli set __qb_hc__ 1 EX 5 >/dev/null && redis-cli del __qb_hc__ >/dev/null",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - quantbridge

  # Backtest worker — Celery prefork (vectorbt/asyncpg fork-safe)
  backend-worker:
    build:
      context: ./apps/api
    container_name: quantbridge-worker
    command: uv run celery -A src.tasks.celery_app worker --loglevel=info --pool=prefork --concurrency=2
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      PROMETHEUS_MULTIPROC_DIR: /metrics
      QB_METRICS_ROLE: worker
      LOG_LEVEL: ${LOG_LEVEL:-INFO} # BL-561 — root logger 레벨 SSOT (command 의 --loglevel 아님)
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-quantbridge}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-quantbridge}
      REDIS_LOCK_URL: ${REDIS_LOCK_URL:-redis://redis:6379/3}
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      OHLCV_PROVIDER: ${OHLCV_PROVIDER:-timescale}
      OHLCV_FIXTURE_ROOT: /app/data/fixtures/ohlcv
      DEFAULT_EXCHANGE: ${DEFAULT_EXCHANGE:-bybit}
      BACKTEST_STALE_THRESHOLD_SECONDS: ${BACKTEST_STALE_THRESHOLD_SECONDS:-1800}
      PINE_ALERT_HEURISTIC_MODE: ${PINE_ALERT_HEURISTIC_MODE:-strict}
      TRADING_ENCRYPTION_KEYS: ${TRADING_ENCRYPTION_KEYS:?required — generate via Fernet.generate_key()}
    volumes:
      - ./apps/api/.metrics:/metrics
    restart: unless-stopped
    networks:
      - quantbridge

  # Sprint 12 Phase C — Bybit Private WebSocket stream worker
  # ws_stream queue 전용 (concurrency=1 — codex G3 #5/#7 dogfood 1-user 가정).
  # acks_late + reject_on_worker_lost 는 celery_app.conf 에서 설정.
  # Sprint 24 BL-012: prefork 복귀 (Sprint 12 G4 revisit `--pool=solo` 한계 해소).
  # Redis distributed lease (BL-011, src/tasks/_ws_lease.py) + worker_process_shutdown
  # 이 signal_all_stop_events() 호출 (codex G.0 P1 #2). multi-account 사용자 지원.
  backend-ws-stream:
    build:
      context: ./apps/api
    container_name: quantbridge-ws-stream
    # 계정 N개 private stream + public ticker 1개이므로 N + 1 ≤ concurrency를 유지한다.
    # Sprint 12 G4 revisit `--pool=solo` 한계 해소 — prefork child 가 worker_process_shutdown
    # 에서 signal_all_stop_events() 호출 (celery_app.py 참조). dogfood multi-account 지원.
    command: uv run celery -A src.tasks.celery_app worker -Q ws_stream --pool=prefork --concurrency=3 --loglevel=info
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      PROMETHEUS_MULTIPROC_DIR: /metrics
      QB_METRICS_ROLE: wsstream
      LOG_LEVEL: ${LOG_LEVEL:-INFO} # BL-561 — root logger 레벨 SSOT (command 의 --loglevel 아님)
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-quantbridge}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-quantbridge}
      REDIS_LOCK_URL: ${REDIS_LOCK_URL:-redis://redis:6379/3}
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      TRADING_ENCRYPTION_KEYS: ${TRADING_ENCRYPTION_KEYS:?required — generate via Fernet.generate_key()}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
    volumes:
      - ./apps/api/.metrics:/metrics
    restart: unless-stopped
    networks:
      - quantbridge

  # Sprint 57 BL-237 — Optimizer heavy queue dedicated worker.
  # optimizer_heavy queue 전용 (concurrency=1 — 단일 optimizer run = CPU/메모리 집중 작업).
  # soft_time_limit=600 / time_limit=660 은 optimizer_tasks.py 데코레이터 에서 설정.
  backend-optimizer-heavy:
    build:
      context: ./apps/api
    container_name: quantbridge-optimizer-heavy
    command: uv run celery -A src.tasks.celery_app worker -Q optimizer_heavy --pool=prefork --concurrency=1 --loglevel=info
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      PROMETHEUS_MULTIPROC_DIR: /metrics
      QB_METRICS_ROLE: optheavy
      LOG_LEVEL: ${LOG_LEVEL:-INFO} # BL-561 — root logger 레벨 SSOT (command 의 --loglevel 아님)
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-quantbridge}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-quantbridge}
      REDIS_LOCK_URL: ${REDIS_LOCK_URL:-redis://redis:6379/3}
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      # optimizer.run 은 이 큐로만 라우팅되고(`celery_app.py` task_routes) 이 컨테이너가
      # 유일한 소비자다. 아래 3종이 없으면 `ohlcv_provider` 가 코드 기본값 "fixture" 로
      # 떨어지고 `ohlcv_fixture_root` 는 CWD(/app) 상대라 `/app/apps/api/data/...` 로 풀려
      # 존재하지 않는다 → 모든 optimizer 실행이 OHLCVFixtureNotFound 로 죽는다.
      # backend-worker 와 동일하게 맞춘다.
      OHLCV_PROVIDER: ${OHLCV_PROVIDER:-timescale}
      OHLCV_FIXTURE_ROOT: /app/data/fixtures/ohlcv
      DEFAULT_EXCHANGE: ${DEFAULT_EXCHANGE:-bybit}
      TRADING_ENCRYPTION_KEYS: ${TRADING_ENCRYPTION_KEYS:?required — generate via Fernet.generate_key()}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
    volumes:
      - ./apps/api/.metrics:/metrics
    restart: unless-stopped
    networks:
      - quantbridge

  # Beat scheduler — reclaim_stale_running 5분 주기 (M3 T29) + ws_reconcile 5분 (Sprint 12)
  # Settings() 가 src.core.config import 시 trading_encryption_keys 등 require →
  # backend-worker 와 동일 env 셋업.
  backend-beat:
    build:
      context: ./apps/api
    container_name: quantbridge-beat
    command: uv run celery -A src.tasks.celery_app beat --loglevel=info --schedule=/data/celerybeat-schedule
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      PROMETHEUS_MULTIPROC_DIR: /metrics
      QB_METRICS_ROLE: beat
      LOG_LEVEL: ${LOG_LEVEL:-INFO} # BL-561 — root logger 레벨 SSOT (command 의 --loglevel 아님)
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-quantbridge}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-quantbridge}
      REDIS_LOCK_URL: ${REDIS_LOCK_URL:-redis://redis:6379/3}
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      OHLCV_PROVIDER: ${OHLCV_PROVIDER:-timescale}
      OHLCV_FIXTURE_ROOT: /app/data/fixtures/ohlcv
      DEFAULT_EXCHANGE: ${DEFAULT_EXCHANGE:-bybit}
      BACKTEST_STALE_THRESHOLD_SECONDS: ${BACKTEST_STALE_THRESHOLD_SECONDS:-1800}
      PINE_ALERT_HEURISTIC_MODE: ${PINE_ALERT_HEURISTIC_MODE:-strict}
      TRADING_ENCRYPTION_KEYS: ${TRADING_ENCRYPTION_KEYS:?required — generate via Fernet.generate_key()}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
    volumes:
      - ./apps/api/.metrics:/metrics
      - beat-data:/data
    restart: unless-stopped
    networks:
      - quantbridge

volumes:
  db-data:
  redis-data:
  # beat-data 소유권은 apps/api/Dockerfile 의 /data seed(appuser)가 첫 생성 시 복사됨.
  # 픽스 이전에 만들어진 root-소유 볼륨은 `docker volume rm <project>_beat-data` 후 재생성.
  beat-data:

networks:
  quantbridge:
    driver: bridge
