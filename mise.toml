# ══════════════════════════════════════════════════════════════════════════════

[tasks.dev]
description = "기본 모드 — up + be + fe 동시 (Ctrl+C 로 양쪽 종료)"
run = """
set -eu
mise run up
echo "▶ be + fe 동시 실행 (Ctrl+C 로 양쪽 종료)"
trap 'kill 0' INT TERM
mise run be &
mise run fe &
wait
"""

[tasks.up]
description = "docker compose up -d (db + redis + workers)"
run = """
set -eu
tools/scripts/assert-main-checkout.sh up || exit 1
tools/scripts/metrics-wipe.sh --project-directory . -f infra/compose/docker-compose.yml
docker compose --project-directory . -f infra/compose/docker-compose.yml up -d
"""

[tasks.down]
description = "docker compose down"
run = """
set -eu
tools/scripts/assert-main-checkout.sh down || exit 1
docker compose --project-directory . -f infra/compose/docker-compose.yml down
"""

[tasks.logs]
description = "docker compose logs -f"
run = "docker compose --project-directory . -f infra/compose/docker-compose.yml logs -f"

[tasks.be]
description = "backend uvicorn (port 8000)"
run = """
set -eu
mise run metrics-prepare
cd apps/api
PROMETHEUS_MULTIPROC_DIR="$PWD/.metrics" \
QB_METRICS_ROLE=api \
  uv run uvicorn src.main:app --no-server-header --reload --host 0.0.0.0 --port 8000
"""

# ★[BL-650 종결] — Turbopack dev 영속 캐시(`.next/dev/cache`)가 자라면 `next dev` 가 **요청
#   0건에서** CPU 를 태우고 낡은 CSS 를 재기동 너머로 계속 준다(1.99GB 사망 · 593MB 무해,
#   2026-08-08 실측). 키우는 것은 빌드가 아니라 **dev 서버 가동 시간**이다 — `.next` 총량 1,715MB
#   중 94.4% 가 이 캐시였다(2026-08-25 실측). Next 16 에 디스크 캐시 상한·GC 옵션은 **없다**
#   (2026-08-25 업스트림 재확인 — 손잡이는 FS 캐시 on/off 와 메모리 eviction 뿐).
#   ★2026-08-25 사용자 결정 — **기동 시 자동 소각.** 임계 1GB 는 문턱 실측치가 아니라 사망점의
#   절반에서 끊는 보수값이다. dev 가 이미 3000 을 듣고 있으면 소각하지 않는다(가동 중 캐시 삭제 금지).
[tasks.fe]
description = "frontend Next.js (port 3000)"
run = """
set -eu
burn="${FE_CACHE_BURN_MB:-1024}"
sz="$(du -sm apps/web/.next/dev/cache 2>/dev/null | cut -f1 || true)"
if [ -n "$sz" ] && [ "$sz" -ge "$burn" ]; then
  if lsof -nP -iTCP:3000 -sTCP:LISTEN -t >/dev/null 2>&1; then
    echo "⚠ .next/dev/cache 가 ${sz}MB ≥ ${burn}MB 인데 3000 이 청취 중이다 — 소각 생략 [BL-650]"
  else
    echo "🔥 apps/web/.next/dev/cache 가 ${sz}MB ≥ ${burn}MB — 소각 후 기동한다 [BL-650]"
    rm -rf apps/web/.next
  fi
fi
cd apps/web && pnpm dev
"""

