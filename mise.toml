[tasks.down-isolated]
description = "격리 스택 down"
run = """
set -eu
tools/scripts/assert-main-checkout.sh down-isolated || exit 1
docker compose --project-directory . -f infra/compose/docker-compose.yml -f infra/compose/docker-compose.isolated.yml down
