[tasks.dev-isolated]
description = "격리 모드 — up + migrate + be + fe 동시 (alembic 자동 적용)"
run = """
set -eu
mise run up-isolated
mise run migrate-isolated
echo "▶ be-isolated + fe-isolated 동시 실행 (Ctrl+C 로 양쪽 종료)"
trap 'kill 0' INT TERM
QB_MIGRATE_DONE=1 mise run be-isolated &
mise run fe-isolated &
wait
"""

[tasks.up-isolated]
description = "격리 스택 부팅 (migrate 미포함)"
run = """
set -eu
tools/scripts/assert-main-checkout.sh up-isolated || exit 1
tools/scripts/soak-stack.sh assert-not-pinned || exit 1
tools/scripts/metrics-wipe.sh --project-directory . -f infra/compose/docker-compose.yml -f infra/compose/docker-compose.isolated.yml
docker compose --project-directory . -f infra/compose/docker-compose.yml -f infra/compose/docker-compose.isolated.yml up -d
"""

# Sprint 23 BL-101 — 코드 변경 후 image 재빌드 + 부팅. daily flow 영향 0.
[tasks.up-isolated-build]
description = "up-isolated + --build (코드 변경 후 image 재빌드)"
run = """
set -eu
tools/scripts/assert-main-checkout.sh up-isolated-build || exit 1
tools/scripts/soak-stack.sh assert-not-pinned || exit 1
tools/scripts/metrics-wipe.sh --project-directory . -f infra/compose/docker-compose.yml -f infra/compose/docker-compose.isolated.yml
docker compose --project-directory . -f infra/compose/docker-compose.yml -f infra/compose/docker-compose.isolated.yml up -d --build
"""

# Sprint 38 BL-181 — 격리 모드 + worker auto-rebuild on src 변경 (ADR-019).
# 패키지 변경은 image rebuild 의무.
[tasks.up-isolated-watch]
description = "worker 3종만 재빌드 + watchfiles 자동 reload (ADR-019)"
run = """
set -eu
tools/scripts/assert-main-checkout.sh up-isolated-watch || exit 1
tools/scripts/soak-stack.sh assert-not-pinned || exit 1
mise run metrics-prepare
docker compose --project-directory . -f infra/compose/docker-compose.yml -f infra/compose/docker-compose.isolated.yml up -d --build backend-worker backend-ws-stream backend-beat
