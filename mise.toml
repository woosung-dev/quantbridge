# QuantBridge — 도구 버전 + 로컬 개발 명령의 SSOT. **이 파일 하나다** ([ADR-036]).
#
# 두 모드 — `.env.local` 변형 없이 명령으로 분기:
#   기본:   3000 / 8000 / 5432 / 6379  (다른 작업 없을 때)
#   격리:   3100 / 8100 / 5433 / 6380  (다른 웹앱·워크트리와 병렬)
#
#   mise run dev              # up + be + fe 동시 (Ctrl+C 로 양쪽 종료)
#   mise run dev-isolated     # 격리 포트로 동일
#   mise tasks                # 전체 목록 (설명은 각 task 의 description 에서 자동 생성)
#
# ★★**이 파일에 Tera 템플릿(여는 중괄호 두 개)을 쓰지 마라.** 하나라도 있으면 mise 가
#   **파일 전체**를 신뢰 대상으로 돌려 `mise trust` 없이는 tools·tasks 가 전부 죽는다
#   (2026-08-16 실측: arg 템플릿을 넣자 무관한 task 까지 거부 → 빼자 복구).
#   그래서 인자는 전부 **환경변수**로 받는다 — 종전 `make db-snapshot DB=x` 와 같은 모양이다.
#   ★★이 경고문 자체도 한 번 걸렸다. mise 는 **주석과 값을 안 가린다** — 문서화하려고 예시를
#   적는 순간 파일이 신뢰 대상이 된다. 예시는 문자 그대로 쓰지 말고 말로 풀어 써라.
#
# ★★**가드를 `depends` 에 기대지 마라.** mise 의 `depends` 는 **병렬**이다
#   (2026-08-16 실측: 0.3초 걸리는 dep 보다 빠른 dep 이 먼저 끝난다). Makefile 시절 두 사고가
#   정확히 「가드보다 부작용이 먼저 돌았다」였다. 그래서 이 파일은 depends 를 거의 쓰지 않고
#   **인라인 순차 호출**로 순서를 못 박는다.
#   ★게다가 mise 에는 `--skip-deps` 와 **`MISE_TASK_SKIP_DEPENDS` 환경변수**가 있다 —
#   make 의 `-o` 보다 넓은 구멍이다. 공유 자원을 건드리는 task 는 **자기 run 첫 줄에서**
#   `tools/scripts/assert-main-checkout.sh` 를 부르고 `|| exit 1` 로 페이로드와 같은 셸에 묶는다.

[tools]
# 로컬 실측 v22.23.1 · `apps/web/Dockerfile:15` 의 `node:22-alpine` 과 같은 해상도(메이저 고정).
# ★CI 는 2026-08-16 까지 20 이었다 — 3면(로컬·프로덕션 이미지·CI) 중 CI 만 20 이었고
#   node 20 은 2026-04-30 EOL 이라 낮은 쪽이 아니라 높은 쪽으로 맞췄다.
node = "22"

# `apps/api/Dockerfile:13,38` 의 `python:3.12-slim` 과 일치.
# ★종전 `apps/api/.python-version` 을 삭제하고 이리로 옮겼다. mise 는 idiomatic 버전 파일을
#   기본으로 읽지 않으므로(실측: `idiomatic_version_file_enable_tools = []`) 두 파일을 함께 두면
#   값이 갈렸을 때 mise 와 uv 가 서로 다른 python 을 조용히 고른다.
#   uv 단독 폴백은 `requires-python` 상한이 막는다 (상한이 없으면 실측상 3.13 을 고른다).
python = "3.12"

# 종전 `apps/web/package.json` 의 `packageManager` 필드가 갖던 값. corepack 대신 mise 가 공급한다.
# ★루트에는 그 필드가 없어 루트 pnpm 이 8.15.9 로 떨어져 있었다(`pnpm-lock.yaml` lockfileVersion 6.0).
pnpm = "9.12.0"

# ★종전 핀이 레포 전체에 0건이었다 — CI 의 `setup-uv` 는 latest 를 깔고 로컬은 수동 설치였다.
uv = "0.10.4"

# ══════════════════════════════════════════════════════════════════════════════
# 도움말
# ══════════════════════════════════════════════════════════════════════════════

[tasks.help]
description = "태스크 목록 + 현재 슬롯/포트"
run = """
set -eu
QB_SLOT="$(sed -n 's/^QB_SLOT[[:space:]]*=[[:space:]]*//p' .worktree-slot 2>/dev/null | tr -d '[:space:]')"
QB_SLOT="${QB_SLOT:-0}"
echo "QuantBridge — 워크트리 슬롯 ${QB_SLOT} (FE $((3100 + QB_SLOT)) / BE $((8100 + QB_SLOT)))"
echo "  * 슬롯 != 0 에서는 up/down/migrate/seed 계열이 거부된다 (공유 자원 보호)"
echo "  * 새 워크트리 준비 = tools/scripts/worktree-bootstrap.sh"
echo "  * 무엇이 병렬 가능한가 = docs/development/worktree-parallel.md"
echo ""
mise tasks
"""

