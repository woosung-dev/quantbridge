[tasks.logs-isolated]
description = "격리 스택 logs -f"
run = "docker compose --project-directory . -f infra/compose/docker-compose.yml -f infra/compose/docker-compose.isolated.yml logs -f"

# Sprint 32 BL-168 — DB healthy 대기 (up-isolated 직후 migrate 가 race 안 타도록).
# `quantbridge-db` container_name 고정 → compose project 이름과 무관.
[tasks.wait-db-isolated]
description = "격리 DB(5433) healthy 대기 — 30s 폴링"
hide = true
run = """
set -eu
echo "▶ wait db (5433) healthy …"
i=1
while [ "$i" -le 30 ]; do
  if docker exec quantbridge-db pg_isready -U quantbridge -d quantbridge >/dev/null 2>&1; then
    echo "  db ready (${i}s)"; exit 0
  fi
  sleep 1; i=$((i + 1))
done
echo "  db NOT ready after 30s" >&2; exit 1
"""

# Sprint 32 BL-168 — 격리 DB 5433 에 alembic upgrade head.
# ★가드가 `wait-db-isolated` 보다 **먼저** 와야 한다. 뒤에 두면 DB 를 30초 폴링한 뒤에야
#   가드가 뜨고, 스택이 내려가 있으면 "DB 가 죽었다" 로 오진해 슬롯 가드 메시지가 영영 안 나온다.
#   이 순서는 depends 로는 보장 못 한다(병렬) — 그래서 인라인이다.
[tasks.migrate-isolated]
description = "alembic upgrade head (격리 DB 5433)"
run = """
set -eu
tools/scripts/assert-main-checkout.sh migrate-isolated || exit 1
mise run wait-db-isolated
echo "▶ alembic upgrade head (격리 DB 5433)"
cd apps/api
DATABASE_URL=postgresql+asyncpg://quantbridge:password@localhost:5433/quantbridge \
  uv run alembic upgrade head
"""

[tasks.migrate]
description = "alembic upgrade head (기본 DB 5432)"
run = """
set -eu
tools/scripts/assert-main-checkout.sh migrate || exit 1
cd apps/api && uv run alembic upgrade head
"""

# ══════════════════════════════════════════════════════════════════════════════
# 소크 스택 (BL-003 게이트) — 정본 = tools/scripts/soak-stack.sh
# 워커가 작업 트리가 아니라 **고정된 커밋 스냅샷**(.soak/src)을 돌게 한다.
# ══════════════════════════════════════════════════════════════════════════════

[tasks.soak-pin]
description = "소크 스냅샷 고정 (COMMIT=<sha> 로 지정)"
run = """
set -eu
tools/scripts/assert-main-checkout.sh soak-pin || exit 1
tools/scripts/soak-stack.sh pin ${COMMIT:-}
"""

[tasks.up-soak]
description = "소크 고정본 스택 부팅"
run = """
set -eu
tools/scripts/assert-main-checkout.sh up-soak || exit 1
tools/scripts/soak-stack.sh up
"""

[tasks.down-soak]
description = "소크 고정본 스택 down"
run = """
set -eu
tools/scripts/assert-main-checkout.sh down-soak || exit 1
tools/scripts/soak-stack.sh down
"""

# ══════════════════════════════════════════════════════════════════════════════
# 개발 서버 — 격리 포트
# ══════════════════════════════════════════════════════════════════════════════

# 환경변수는 process env > dotenv 우선순위 (pydantic-settings).
#
# Sprint 32 BL-168 — be-isolated 단독 실행도 fresh start 호환 (db healthy + alembic 자동).
# `QB_MIGRATE_DONE=1` 이면 건너뛴다 (dev-isolated 가 이미 돌린 경우).
#
# ★**워크트리에서는 migrate 를 아예 안 건다.** 대상이 **공유 앱 DB** 라 워크트리 브랜치의
#   마이그레이션이 다른 워크트리와 메인에 함께 걸린다. 종전 Makefile 은 `ifeq ($(QB_SLOT),0)`
#   으로 판정했는데, 그건 `make QB_SLOT=0` 한 줄로 꺼진다. 여기서는 **git 에게 묻는다** —
#   `assert-main-checkout.sh` 는 git-dir 과 git-common-dir 이 갈리는지를 보므로 어떤 env
#   로도 못 바꾼다. 즉 이 이관은 판정 근거를 **더 단단한 쪽으로** 옮겼다.
[tasks.be-isolated]
description = "backend uvicorn (격리 포트) — 메인 체크아웃이면 migrate 선행"
run = """
set -eu
if [ "${QB_MIGRATE_DONE:-0}" != "1" ] && tools/scripts/assert-main-checkout.sh be-isolated >/dev/null 2>&1; then
  mise run migrate-isolated
else
  echo "▶ migrate-isolated 생략 — QB_MIGRATE_DONE=${QB_MIGRATE_DONE:-0} 또는 워크트리(공유 앱 DB 보호)"
fi
mise run metrics-prepare
QB_SLOT="$(sed -n 's/^QB_SLOT[[:space:]]*=[[:space:]]*//p' .worktree-slot 2>/dev/null | tr -d '[:space:]')"
QB_SLOT="${QB_SLOT:-0}"
QB_FE_PORT=$((3100 + QB_SLOT))
QB_BE_PORT=$((8100 + QB_SLOT))
METRICS_DIR="$PWD/apps/api/.metrics"
cd apps/api
DATABASE_URL=postgresql+asyncpg://quantbridge:password@localhost:5433/quantbridge \
CELERY_BROKER_URL=redis://localhost:6380/1 \
CELERY_RESULT_BACKEND=redis://localhost:6380/2 \
REDIS_LOCK_URL=redis://localhost:6380/3 \
FRONTEND_URL="http://localhost:${QB_FE_PORT}" \
BETTER_AUTH_URL="http://localhost:${QB_FE_PORT}" \
WAITLIST_INVITE_BASE_URL="http://localhost:${QB_FE_PORT}/invite" \
PROMETHEUS_MULTIPROC_DIR="$METRICS_DIR" \
QB_METRICS_ROLE=api \
  uv run uvicorn src.main:app --no-server-header --reload --host 0.0.0.0 --port "$QB_BE_PORT"
"""

[tasks.fe-isolated]
description = "frontend Next.js (격리 포트)"
run = """
set -eu
QB_SLOT="$(sed -n 's/^QB_SLOT[[:space:]]*=[[:space:]]*//p' .worktree-slot 2>/dev/null | tr -d '[:space:]')"
QB_SLOT="${QB_SLOT:-0}"
QB_FE_PORT=$((3100 + QB_SLOT))
QB_BE_PORT=$((8100 + QB_SLOT))
cd apps/web
NEXT_PUBLIC_API_URL="http://localhost:${QB_BE_PORT}" \
NEXT_PUBLIC_WS_URL="ws://localhost:${QB_BE_PORT}" \
BETTER_AUTH_URL="http://localhost:${QB_FE_PORT}" \
PORT="$QB_FE_PORT" \
  pnpm dev
"""

# ══════════════════════════════════════════════════════════════════════════════
# DB 백업 / 복원 ([BL-451])
#
# 2026-07-25 에 로컬 개발 DB 가 전소했다 — 주문 17행 · 암호화된 Bybit demo API 키 1 ·
# 전략 6종 Pine 소스 · 세션 4 · 이벤트 10. `.env.local` 에 평문 키가 없어 **API 키는 복구
# 불가**였고 사용자가 재등록해야 했다.
#
# ★대상 DB 를 **인자로 명시**한다. 기본/격리 스택은 `container_name` 이 같아 "지금 뜬 것" 에
#   따라 대상이 갈리기 때문이다. 특히 `db-restore` 의 `TO` 는 기본값이 없다 — 기본값을
#   개발 DB 로 두면 그 편의가 곧 이 항목이 막으려는 사고다.
#
#   mise run db-snapshot                      # 개발 DB → .backups/<db>-<ts>.dump
#   DB=quantbridge_test mise run db-snapshot
#   FILE=.backups/x.dump TO=quantbridge_restore_probe mise run db-restore
# ══════════════════════════════════════════════════════════════════════════════

[tasks.db-snapshot]
description = "개발 DB → .backups/<db>-<ts>.dump (DB= 로 대상 지정)"
run = """
set -eu
tools/scripts/assert-main-checkout.sh db-snapshot || exit 1
db="${DB:-quantbridge}"
mkdir -p .backups
out=".backups/${db}-$(date -u +%Y%m%dT%H%M%SZ).dump"
echo "▶ pg_dump ${db} → ${out}"
if ! docker compose --project-directory . -f infra/compose/docker-compose.yml exec -T db pg_dump -U quantbridge -d "$db" -Fc > "$out"; then
  rm -f "$out"; echo "  ✗ pg_dump 실패 — 빈 파일을 남기지 않는다" >&2; exit 1
fi
size="$(wc -c < "$out" | tr -d ' ')"
if [ "$size" -le 0 ]; then
  rm -f "$out"; echo "  ✗ 덤프 크기가 0 이다" >&2; exit 1
fi
echo "  ✓ ${out} (${size} bytes)"
"""

[tasks.db-restore]
description = "덤프 복원 — FILE= 와 TO= 둘 다 필수 (TO 에 기본값 없음이 안전장치)"
run = """
set -eu
tools/scripts/assert-main-checkout.sh db-restore || exit 1
test -n "${FILE:-}" || { echo "FILE=<덤프 경로> 가 필요하다" >&2; exit 1; }
test -f "${FILE}"   || { echo "${FILE} 가 없다" >&2; exit 1; }
test -n "${TO:-}"   || { echo "TO=<대상 DB> 가 필요하다 — 기본값을 두지 않는 것이 안전장치다" >&2; exit 1; }
echo "▶ pg_restore ${FILE} → ${TO}"
docker compose --project-directory . -f infra/compose/docker-compose.yml exec -T db pg_restore -U quantbridge -d "$TO" --clean --if-exists < "$FILE"
echo "  ✓ 복원 완료 → ${TO}"
"""

# dogfood 복원 시더 — 빈 DB 를 전 화면 사용 가능 상태로. 멱등.
# OHLCV 는 따로 안 심는다 — TimescaleProvider 가 cache-miss 시 Bybit 에서 받아 ts.ohlcv 에
# 직접 쓰므로 첫 백테스트가 곧 시딩이다.
[tasks.seed]
description = "dogfood 시더 (ONLY= 로 하나만)"
run = """
set -eu
tools/scripts/assert-main-checkout.sh seed || exit 1
cd apps/api
set -a; . ./.env.local; set +a
if [ -n "${ONLY:-}" ]; then
  uv run python scripts/seed_dogfood.py --confirm --only "$ONLY"
else
  uv run python scripts/seed_dogfood.py --confirm
fi
"""

