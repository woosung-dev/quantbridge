<!DOCTYPE html>
<html lang="ko" class="dark">
<!--
  QuantBridge Redesign · 화면 뷰어
  확정 C 디자인 언어로 만든 전 화면을 탭으로 전환하며 실물 크기로 본다.
  2안이 있는 화면은 "2안 비교" 를 켜면 좌우로 나란히 렌더된다.
  서버. cd docs/prototypes/shotgun-2026-07 && python3 -m http.server 4173  ->  http://localhost:4173/viewer.html
-->
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>화면 뷰어 · QuantBridge</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0b0d0f; --bar: #101214; --card: #141619; --card-2: #1a1d21;
    --ink: #e8eaed; --ink-2: #a6adb5; --ink-3: #8b939c;
    --copper: #f08c2e; --line: #22262b; --line-2: #31363d;
    --bull: #2dd4a7; --bear: #f6685e;
    --r: 12px;
    --sans: "Pretendard Variable", Pretendard, system-ui, sans-serif;
    --display: "Archivo", var(--sans);
    --mono: "IBM Plex Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  /* .pane 의 display:flex 가 브라우저 기본 [hidden]{display:none} 을 이겨서
     B 패널이 hidden 인데도 화면 절반을 빈 채로 차지하던 문제. 작성자 스타일로 명시 차단한다. */
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--ink); font-family: var(--sans);
    display: flex; flex-direction: column; overflow: hidden;
    -webkit-font-smoothing: antialiased; font-size: 14px;
  }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
  a { color: inherit; text-decoration: none; }
  :focus-visible { outline: 2px solid var(--copper); outline-offset: 2px; border-radius: var(--r); }

  .bar {
    flex: none; background: var(--bar); border-bottom: 1px solid var(--line);
    padding: 10px 16px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  .brand { display: flex; align-items: baseline; gap: 9px; }
  .brand b { font-family: var(--display); font-size: 14px; font-weight: 700; letter-spacing: -.01em; }
  .brand span { font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); letter-spacing: .1em; text-transform: uppercase; }
  .spacer { flex: 1; }

  .toggle, .vp button, .open {
    font-family: var(--mono); font-size: 11.5px; color: var(--ink-2);
    border: 1px solid var(--line); border-radius: var(--r); padding: 6px 11px;
    transition: border-color .15s ease, color .15s ease, background .15s ease;
  }
  .toggle:hover, .vp button:hover { color: var(--ink); border-color: var(--line-2); }
  .toggle[aria-pressed="true"], .vp button[aria-pressed="true"] { color: var(--copper); border-color: var(--copper); background: rgba(240,140,46,.1); }
  .toggle[disabled] { opacity: .4; cursor: not-allowed; }
  .vp { display: flex; align-items: center; gap: 6px; }
  .vp-label { font-family: var(--mono); font-size: 10px; color: var(--ink-3); letter-spacing: .1em; text-transform: uppercase; }
  .open { background: var(--copper); border-color: var(--copper); color: #1a1006; font-weight: 600; }
  .open:hover { background: #f79d4d; border-color: #f79d4d; color: #1a1006; }

  .body { flex: 1; min-height: 0; display: flex; }

  /* 좌측 화면 목록 */
  .rail {
    flex: none; width: 236px; background: var(--bar); border-right: 1px solid var(--line);
    overflow-y: auto; padding: 12px 10px 24px;
  }
  .rail h2 {
    font-family: var(--mono); font-size: 10px; font-weight: 600; letter-spacing: .14em;
    text-transform: uppercase; color: var(--ink-3); padding: 14px 8px 6px;
  }
  .item {
    display: flex; align-items: center; gap: 8px; width: 100%;
    padding: 8px 10px; border-radius: var(--r); text-align: left;
    color: var(--ink-2); font-size: 13px; line-height: 1.3;
    transition: background .15s ease, color .15s ease;
  }
  .item:hover { background: var(--card); color: var(--ink); }
  .item[aria-current="true"] { background: rgba(240,140,46,.12); color: var(--copper); font-weight: 600; }
  .item .no { font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); flex: none; width: 20px; }
  .item[aria-current="true"] .no { color: var(--copper); }
  .item .ab {
    margin-left: auto; font-family: var(--mono); font-size: 9.5px; font-weight: 600;
    color: var(--copper); border: 1px solid rgba(240,140,46,.3); border-radius: var(--r); padding: 0 5px;
  }

  /* 스테이지 */
  .stage { flex: 1; min-width: 0; display: flex; flex-direction: column; background: #08090a; }
  .stage-head {
    flex: none; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 8px 14px; border-bottom: 1px solid var(--line); background: var(--bar);
    font-size: 12.5px; color: var(--ink-2);
  }
  .stage-head b { font-weight: 600; color: var(--ink); }
  .stage-head code { font-family: var(--mono); font-size: 11px; color: var(--ink-3); }
  .frames { flex: 1; min-height: 0; display: flex; justify-content: center; gap: 14px; overflow: auto; padding: 0; }
  .frames.framed { padding: 16px; }
  .pane { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .pane-label {
    flex: none; font-family: var(--mono); font-size: 10.5px; color: var(--ink-3);
    letter-spacing: .1em; text-transform: uppercase; padding: 0 0 6px 2px;
  }
  iframe { flex: 1; width: 100%; border: 0; background: var(--bg); display: block; }
  .frames.framed iframe { border: 1px solid var(--line-2); border-radius: var(--r); }

  .hint {
    flex: none; background: var(--bar); border-top: 1px solid var(--line);
    padding: 7px 16px; font-family: var(--mono); font-size: 11px; color: var(--ink-3);
  }
  .hint b { color: var(--ink-2); font-weight: 500; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
  }
  @media (max-width: 900px) {
    .rail { width: 64px; }
    .rail h2, .item span:not(.no) { display: none; }
    .item { justify-content: center; }
  }
</style>
</head>
<body>

<div class="bar">
  <div class="brand"><b>QuantBridge</b><span>C 언어 화면 세트</span></div>
  <div class="spacer"></div>
  <button class="toggle" id="cmp" type="button" aria-pressed="false" disabled>다크 비교</button>
  <div class="vp" role="group" aria-label="뷰포트 너비 프리셋">
    <span class="vp-label">Viewport</span>
    <button data-w="0" aria-pressed="true" type="button">전체</button>
    <button data-w="1440" aria-pressed="false" type="button">1440</button>
    <button data-w="1024" aria-pressed="false" type="button">1024</button>
    <button data-w="768" aria-pressed="false" type="button">768</button>
    <button data-w="375" aria-pressed="false" type="button">375</button>
  </div>
  <a class="open" id="openNew" href="variant-c.html" target="_blank" rel="noopener">새 탭</a>
</div>

<div class="body">
  <nav class="rail" id="rail" aria-label="화면 목록"></nav>

  <div class="stage">
    <div class="stage-head">
      <b id="shName">백테스트 리포트</b>
      <code id="shFile">variant-c.html</code>
      <span id="shNote"></span>
    </div>
    <div class="frames" id="frames">
      <div class="pane" id="paneA">
        <span class="pane-label" id="labelA" hidden>라이트</span>
        <iframe id="frameA" src="variant-c.html" title="선택한 화면 미리보기"></iframe>
      </div>
      <div class="pane" id="paneB" hidden>
        <span class="pane-label" id="labelB">다크</span>
        <iframe id="frameB" src="about:blank" title="다크 짝 미리보기"></iframe>
      </div>
    </div>
  </div>
</div>

<div class="hint">
  <b>↑/↓</b> 화면 이동 · <b>C</b> 다크 비교 · <b>1~5</b> 뷰포트 · 서버 <b>python3 serve.py</b> · 빌드 <b id="build">2026-07-20f</b> <span id="loadedAt"></span> · 라이트 팔레트 B2 확정
</div>

<script>
(function () {
  var GROUPS = [
    { title: '정본', items: [
      { no: '00', name: '백테스트 리포트', file: 'variant-c.html', note: '확정 디자인 언어의 정본' },
    ]},
    { title: 'P1 데일리 드라이버', items: [
      { pick: 'A안 · 세로 리포트 채택', no: '01', name: '트레이딩 코크핏', file: 'screen-01-trading-cockpit.html' },
      { pick: 'A안 · 성과 요약 채택', no: '02', name: '대시보드', file: 'screen-02-dashboard.html' },
      { no: '03', name: '백테스트 목록', file: 'screen-03-backtests-list.html' },
      { no: '04', name: '트레이드 상세', file: 'screen-04-trade-detail.html' },
    ]},
    { title: 'P2 생성·설정', items: [
      { pick: 'A안 · 단일 폼 채택', no: '05', name: '백테스트 설정', file: 'screen-05-backtest-setup.html' },
      { no: '06', name: '전략 목록', file: 'screen-06-strategies-list.html' },
      { no: '07', name: '전략 생성', file: 'screen-07-strategy-create.html' },
      { pick: 'B안 · 상하 분할 채택', no: '08', name: '전략 편집', file: 'screen-08-strategy-editor.html' },
    ]},
    { title: 'P3 나머지 제품', items: [
      { no: '09', name: '옵티마이저 목록', file: 'screen-09-optimizer-list.html' },
      { pick: 'B안 · 리더보드 우선 채택', no: '10', name: '옵티마이저 상세', file: 'screen-10-optimizer-detail.html' },
      { no: '11', name: '주문', file: 'screen-11-orders.html' },
      { no: '12', name: '온보딩', file: 'screen-12-onboarding.html' },
      { no: '13', name: '에러 · 유지보수', file: 'screen-13-error-pages.html' },
    ]},
    { title: '라이트 테마 (팔레트 B2 확정)', items: [
      { no: 'L1', name: '리포트 (라이트)', file: 'light-01-report.html', pair: 'variant-c.html', pairName: '다크 정본' },
      { no: 'L2', name: '코크핏 (라이트)', file: 'light-02-trading-cockpit.html', pair: 'screen-01-trading-cockpit.html', pairName: '다크 정본' },
    ]},
    { title: 'P4 마케팅', items: [
      { no: '14', name: '랜딩', file: 'screen-14-landing.html' },
      { no: '15', name: '로그인', file: 'screen-15-login.html' },
      { no: '16', name: '프라이싱', file: 'screen-16-pricing.html' },
      { no: '17', name: '웨이트리스트', file: 'screen-17-waitlist.html' },
    ]},
  ];

  var flat = [];
  var rail = document.getElementById('rail');
  GROUPS.forEach(function (g) {
    var h = document.createElement('h2');
    h.textContent = g.title;
    rail.appendChild(h);
    g.items.forEach(function (it) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'item';
      b.setAttribute('aria-current', 'false');
      b.setAttribute('aria-label', it.no + ' ' + it.name);
      b.innerHTML = '<span class="no">' + it.no + '</span><span>' + it.name + '</span>' +
        (it.pick ? '<span class="ab" aria-hidden="true" title="' + it.pick + '">픽</span>' : '') +
        (it.pair ? '<span class="ab" aria-hidden="true" title="다크와 나란히 비교 가능">비교</span>' : '');
      b.addEventListener('click', function () { select(it); });
      it.el = b;
      flat.push(it);
      rail.appendChild(b);
    });
  });

  var frameA = document.getElementById('frameA');
  var frameB = document.getElementById('frameB');
  var paneB = document.getElementById('paneB');
  var labelA = document.getElementById('labelA');
  var labelB = document.getElementById('labelB');
  var cmp = document.getElementById('cmp');
  var frames = document.getElementById('frames');
  var openNew = document.getElementById('openNew');
  var comparePref = null;
  // 화면 파일도 캐시로 굳는다. 이 뷰어를 연 시각을 붙여 매 로드마다 새로 받게 한다.
  var BUST = '?v=' + Date.now();
  var bust = function (u) { return u + BUST; };
  document.getElementById('loadedAt').textContent =
    '· 로드 ' + new Date().toTimeString().slice(0, 8);
  var cur = flat[0];

  function render() {
    var compare = !!cur.pair && (comparePref === null ? true : comparePref);
    flat.forEach(function (it) { it.el.setAttribute('aria-current', String(it === cur)); });
    document.getElementById('shName').textContent = cur.name;
    document.getElementById('shFile').textContent = cur.file;
    document.getElementById('shNote').textContent =
      cur.note || cur.pick || (cur.pair ? (compare ? '다크와 나란히 비교 중' : 'C 로 다크 비교') : '');
    frameA.src = bust(cur.file);
    openNew.href = cur.file;
    cmp.disabled = !cur.pair;
    cmp.setAttribute('aria-pressed', String(compare));
    paneB.hidden = !compare;
    labelA.hidden = !compare;
    if (compare) { labelA.textContent = '라이트 (검토 대상)'; labelB.textContent = cur.pairName; }
    frameB.src = compare ? bust(cur.pair) : 'about:blank';
    try { history.replaceState(null, '', '#' + cur.no); } catch (e) {}
  }

  function select(it) { cur = it; render(); }

  cmp.addEventListener('click', function () {
    if (!cur.pair) return;
    comparePref = cmp.getAttribute('aria-pressed') !== 'true';
    render();
  });

  var vpBtns = Array.prototype.slice.call(document.querySelectorAll('.vp button'));
  vpBtns.forEach(function (b) {
    b.addEventListener('click', function () {
      vpBtns.forEach(function (o) { o.setAttribute('aria-pressed', String(o === b)); });
      var w = b.getAttribute('data-w');
      if (!w || w === '0') {
        frames.classList.remove('framed');
        [frameA, frameB].forEach(function (f) { f.style.width = '100%'; f.style.maxWidth = 'none'; });
      } else {
        frames.classList.add('framed');
        [frameA, frameB].forEach(function (f) { f.style.width = w + 'px'; f.style.maxWidth = '100%'; });
      }
    });
  });

  document.addEventListener('keydown', function (e) {
    if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
    var i = flat.indexOf(cur);
    if (e.key === 'ArrowDown') { select(flat[(i + 1) % flat.length]); e.preventDefault(); }
    else if (e.key === 'ArrowUp') { select(flat[(i - 1 + flat.length) % flat.length]); e.preventDefault(); }
    else if (e.key === 'c' || e.key === 'C') { cmp.click(); }
    else if (/^[1-5]$/.test(e.key)) { vpBtns[Number(e.key) - 1].click(); }
  });

  var h = (location.hash || '').replace('#', '');
  var found = flat.filter(function (it) { return it.no === h; })[0];
  if (found) cur = found;
  render();
})();
</script>
</body>
</html>
