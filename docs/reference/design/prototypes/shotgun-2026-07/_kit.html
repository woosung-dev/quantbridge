<!DOCTYPE html>
<!--
  QuantBridge · C 디자인 언어 공용 셸 (KIT)
  정본 = variant-c.html. 이 파일은 그 토큰/컴포넌트/셸을 그대로 잘라낸 복사본이다.
  새 화면은 이 파일을 복사해 시작한다. 토큰 블록과 공용 컴포넌트 CSS 는 수정하지 않는다.
  화면 고유 CSS 는 반드시 "PAGE-SPECIFIC" 마커 아래에만 추가한다.

  치환 지점.
  1. <title> — "화면명 | QuantBridge"
  2. 사이드바 .nav-item 중 현재 화면에 active + aria-current="page" 부여 (다른 것에서는 제거)
  3. .nav-count 숫자는 화면 간 동일 값 유지 (전략 12 / 백테스트 48 / 주문 7)
  4. 상단 breadcrumb .crumbs
  5. <main> 안의 PAGE CONTENT
-->
<html lang="ko" class="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>화면명 | QuantBridge</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  /* ==========================================================
     TOKENS — Precision Instrument carbon/steel, dark = default.
     Mirrors frontend/src/styles/globals.css .dark block.
     ========================================================== */
  :root {
    --bg: #0b0d0f;
    --bg-alt: #101214;
    --card: #141619;
    --card-2: #1a1d21;
    --card-3: #1e2226;
    --line: #22262b;
    --line-2: #31363d;

    --ink: #e8eaed;
    --ink-2: #a6adb5;
    --ink-3: #8b939c;

    /* the single brand accent */
    --copper: #f08c2e;
    --copper-hover: #f79d4d;
    --copper-ink: #1a1006;
    --copper-soft: rgba(240, 140, 46, 0.12);
    --copper-line: rgba(240, 140, 46, 0.3);

    /* semantic data colors — P&L only */
    --bull: #2dd4a7;
    --bull-soft: rgba(45, 212, 167, 0.12);
    --bear: #f6685e;
    --bear-soft: rgba(246, 104, 94, 0.12);
    /* semantic status color — degraded / failed panels only */
    --warn: #e5a93d;
    --warn-soft: rgba(229, 169, 61, 0.1);
    /* chart-only second series */
    --benchmark: #6aa2f7;

    /* ONE radius scale */
    --r: 12px;

    /* soft elevation, the signature of this variant */
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.55), 0 10px 26px -14px rgba(0, 0, 0, 0.8);
    --shadow-hi: 0 1px 2px rgba(0, 0, 0, 0.55), 0 16px 34px -16px rgba(0, 0, 0, 0.9);

    --ease: cubic-bezier(0.16, 1, 0.3, 1);
    --dur: 220ms;

    --sidebar-w: 232px;
    --topbar-h: 60px;

    --f-body: 'Pretendard Variable', Pretendard, system-ui, sans-serif;
    --f-display: 'Archivo', 'Pretendard Variable', system-ui, sans-serif;
    --f-mono: 'IBM Plex Mono', ui-monospace, monospace;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--f-body);
    font-size: 14px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  a { color: inherit; text-decoration: none; }
  ul, ol { list-style: none; }
  button, input, select { font-family: inherit; font-size: inherit; color: inherit; }
  button { border: none; background: none; cursor: pointer; }

  ::selection { background: var(--copper-soft); color: var(--ink); }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: var(--r); border: 3px solid var(--bg); }

  :focus-visible {
    outline: 2px solid var(--copper);
    outline-offset: 2px;
    border-radius: var(--r);
  }

  .mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
  .pos { color: var(--bull); }
  .neg { color: var(--bear); }
  .dim { color: var(--ink-3); }

  /* ================= APP SHELL · SIDEBAR ================= */
  .sidebar {
    position: fixed;
    inset: 0 auto 0 0;
    width: var(--sidebar-w);
    background: var(--bg-alt);
    border-right: 1px solid var(--line);
    padding: 16px 12px;
    display: flex;
    flex-direction: column;
    z-index: 120;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    height: 44px;
    padding: 0 8px;
    margin-bottom: 20px;
  }

  .brand-mark {
    width: 30px;
    height: 30px;
    border-radius: var(--r);
    background: var(--copper);
    color: var(--copper-ink);
    display: grid;
    place-items: center;
    flex-shrink: 0;
  }

  .brand-name {
    font-family: var(--f-display);
    font-weight: 700;
    font-size: 1rem;
    letter-spacing: -0.01em;
  }

  .nav-group-label {
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-3);
    padding: 0 10px;
    margin: 6px 0 6px;
  }

  .nav {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .nav-item {
    position: relative;
    display: flex;
    align-items: center;
    gap: 10px;
    min-height: 40px;
    padding: 8px 10px;
    border-radius: var(--r);
    color: var(--ink-2);
    font-size: 0.875rem;
    font-weight: 500;
    transition: background var(--dur) var(--ease), color var(--dur) var(--ease);
  }
  .nav-item svg { width: 17px; height: 17px; flex-shrink: 0; stroke: currentColor; stroke-width: 1.6; }
  .nav-item:hover { background: var(--card-2); color: var(--ink); }

  .nav-item.active {
    background: var(--copper-soft);
    color: var(--copper);
    font-weight: 600;
  }
  .nav-item.active::before {
    content: "";
    position: absolute;
    left: 0;
    top: 9px;
    bottom: 9px;
    width: 3px;
    border-radius: 0 var(--r) var(--r) 0;
    background: var(--copper);
  }

  .nav-count {
    margin-left: auto;
    font-family: var(--f-mono);
    font-size: 0.7rem;
    font-weight: 600;
    color: var(--ink-3);
    background: var(--card-2);
    border: 1px solid var(--line);
    border-radius: var(--r);
    padding: 1px 7px;
  }

  .sidebar-foot { margin-top: auto; padding-top: 12px; border-top: 1px solid var(--line); }

  .account {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 8px 10px;
    border-radius: var(--r);
    text-align: left;
    transition: background var(--dur) var(--ease);
  }
  .account:hover { background: var(--card-2); }

  .avatar {
    width: 32px;
    height: 32px;
    border-radius: var(--r);
    background: var(--card-3);
    border: 1px solid var(--line-2);
    color: var(--ink);
    display: grid;
    place-items: center;
    font-family: var(--f-mono);
    font-size: 0.72rem;
    font-weight: 600;
    flex-shrink: 0;
  }

  .account-name { font-size: 0.84rem; font-weight: 600; line-height: 1.2; }
  .account-sub { font-size: 0.72rem; color: var(--ink-3); line-height: 1.3; }

  /* ================= APP SHELL · TOP BAR ================= */
  .topbar {
    position: sticky;
    top: 0;
    height: var(--topbar-h);
    margin-left: var(--sidebar-w);
    background: rgba(11, 13, 15, 0.86);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 24px;
    z-index: 110;
  }

  .hamburger {
    display: none;
    width: 40px;
    height: 40px;
    border-radius: var(--r);
    color: var(--ink-2);
    place-items: center;
  }
  .hamburger:hover { background: var(--card-2); color: var(--ink); }

  .crumbs {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
    font-size: 0.85rem;
    color: var(--ink-3);
  }
  .crumbs a { white-space: nowrap; }
  .crumbs a:hover { color: var(--ink); }
  .crumbs .sep { color: var(--line-2); }
  .crumbs .here { color: var(--ink); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .topbar-spacer { flex: 1; }

  .searchbox {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 260px;
    height: 38px;
    padding: 0 12px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--r);
    color: var(--ink-3);
    transition: border-color var(--dur) var(--ease), background var(--dur) var(--ease);
  }
  .searchbox:hover { border-color: var(--line-2); }
  /* 안쪽 input 은 outline 을 유지하되(박스 안에서 링이 어색하므로) 컨테이너에 포커스 링을 준다.
     .searchbox input 의 outline:none 은 특이도 0,1,1 이라 :focus-visible 0,1,0 을 항상 이겨
     키보드 포커스가 완전히 비가시였다. */
  .searchbox:focus-within { outline: 2px solid var(--copper); outline-offset: 2px; border-color: var(--line-2); }
  .searchbox input { flex: 1; min-width: 0; border: none; background: none; outline: none; font-size: 0.84rem; }
  .searchbox input::placeholder { color: var(--ink-3); }
  .kbd {
    font-family: var(--f-mono);
    font-size: 0.68rem;
    font-weight: 600;
    color: var(--ink-3);
    border: 1px solid var(--line-2);
    border-radius: var(--r);
    padding: 1px 6px;
  }

  .icon-btn {
    width: 38px;
    height: 38px;
    display: grid;
    place-items: center;
    border-radius: var(--r);
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink-2);
    transition: background var(--dur) var(--ease), color var(--dur) var(--ease), border-color var(--dur) var(--ease);
  }
  .icon-btn:hover { background: var(--card-2); border-color: var(--line-2); color: var(--ink); }
  .icon-btn svg { width: 17px; height: 17px; stroke: currentColor; stroke-width: 1.7; }

  /* ================= MAIN ================= */
  .main {
    margin-left: var(--sidebar-w);
    min-height: calc(100vh - var(--topbar-h));
  }

  .page {
    max-width: 1240px;
    margin: 0 auto;
    padding: 28px 24px 64px;
  }

  /* ================= BUTTONS ================= */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    min-height: 38px;
    padding: 0 14px;
    border-radius: var(--r);
    border: 1px solid var(--line-2);
    background: var(--card-2);
    color: var(--ink);
    font-size: 0.84rem;
    font-weight: 600;
    white-space: nowrap;
    transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease), transform 120ms var(--ease);
  }
  .btn svg { width: 15px; height: 15px; stroke: currentColor; stroke-width: 1.8; }
  .btn:hover { background: var(--card-3); border-color: var(--ink-3); }
  .btn:active { transform: translateY(1px); }

  .btn-primary {
    background: var(--copper);
    border-color: var(--copper);
    color: var(--copper-ink);
  }
  .btn-primary:hover { background: var(--copper-hover); border-color: var(--copper-hover); }

  .btn-ghost { background: transparent; border-color: var(--line); color: var(--ink-2); }
  .btn-ghost:hover { background: var(--card-2); color: var(--ink); }

  .btn-block { width: 100%; }

  /* ================= CARD ================= */
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--r);
    box-shadow: var(--shadow);
    transition: box-shadow var(--dur) var(--ease), border-color var(--dur) var(--ease), transform var(--dur) var(--ease);
  }
  .card-pad { padding: 20px 22px; }

  .card-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    padding: 18px 22px;
    border-bottom: 1px solid var(--line);
  }
  .card-title {
    font-family: var(--f-display);
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .card-sub { font-size: 0.8rem; color: var(--ink-3); margin-top: 3px; }
  .card-body { padding: 20px 22px; }

  /* ================= SECTION HEADERS ================= */
  .section { margin-top: 28px; }

  .section-head { margin-bottom: 14px; }

  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: var(--f-mono);
    font-size: 0.68rem;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-3);
    margin-bottom: 6px;
  }
  .eyebrow .num {
    color: var(--copper);
    border: 1px solid var(--copper-line);
    background: var(--copper-soft);
    border-radius: var(--r);
    padding: 0 6px;
    letter-spacing: 0.06em;
  }

  .section-title {
    font-family: var(--f-display);
    font-size: 1.18rem;
    font-weight: 700;
    letter-spacing: -0.015em;
  }
  .section-desc { font-size: 0.85rem; color: var(--ink-3); margin-top: 3px; max-width: 68ch; }

  /* ================= REPORT HEADER ================= */
  .report {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 20px;
    flex-wrap: wrap;
    padding: 22px;
  }
  .report-title {
    font-family: var(--f-display);
    font-size: 1.6rem;
    font-weight: 700;
    letter-spacing: -0.025em;
    line-height: 1.15;
  }
  .report-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 12px;
  }

  .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 26px;
    padding: 0 10px;
    border-radius: var(--r);
    border: 1px solid var(--line);
    background: var(--card-2);
    font-family: var(--f-mono);
    font-size: 0.74rem;
    font-weight: 500;
    color: var(--ink-2);
  }
  .chip svg { width: 12px; height: 12px; stroke: currentColor; stroke-width: 2; }
  .chip.done { color: var(--bull); border-color: rgba(45, 212, 167, 0.32); background: var(--bull-soft); }
  .chip.accent { color: var(--copper); border-color: var(--copper-line); background: var(--copper-soft); }

  .report-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

  /* ================= HERO KPI ================= */
  .kpi-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
  }

  .kpi {
    position: relative;
    padding: 18px 20px 16px;
    overflow: hidden;
  }
  .kpi:hover { box-shadow: var(--shadow-hi); border-color: var(--line-2); transform: translateY(-2px); }

  .kpi-label {
    font-size: 0.76rem;
    font-weight: 600;
    color: var(--ink-3);
    letter-spacing: 0.02em;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .kpi-value {
    font-family: var(--f-mono);
    font-size: 1.85rem;
    font-weight: 600;
    letter-spacing: -0.03em;
    line-height: 1.15;
    margin-top: 10px;
    font-variant-numeric: tabular-nums;
  }
  .kpi-foot {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--line);
    font-size: 0.76rem;
    color: var(--ink-3);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .kpi-foot .mono { color: var(--ink-2); }

  .meter {
    height: 4px;
    border-radius: var(--r);
    background: var(--card-3);
    overflow: hidden;
    margin-top: 12px;
  }
  .meter > span { display: block; height: 100%; border-radius: var(--r); background: var(--copper); }
  .meter.bull > span { background: var(--bull); }
  .meter.bear > span { background: var(--bear); }

  /* ================= CHART ================= */
  .chart-head-actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }

  .tabs {
    display: inline-flex;
    gap: 2px;
    padding: 3px;
    background: var(--card-2);
    border: 1px solid var(--line);
    border-radius: var(--r);
  }
  .tab {
    position: relative;
    min-height: 30px;
    padding: 0 12px;
    border-radius: var(--r);
    font-family: var(--f-mono);
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--ink-3);
    transition: color var(--dur) var(--ease), background var(--dur) var(--ease);
  }
  .tab:hover { color: var(--ink); }
  .tab.active { background: var(--card-3); color: var(--copper); }

  .legend {
    display: flex;
    align-items: center;
    gap: 18px;
    flex-wrap: wrap;
    padding: 0 22px 14px;
  }
  .legend-item { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; color: var(--ink-2); }
  .legend-key { width: 16px; height: 3px; border-radius: var(--r); flex-shrink: 0; }
  .legend-key.eq { background: var(--copper); }
  .legend-key.bm { background: var(--benchmark); }
  .legend-key.dd { background: var(--bear); }
  .legend-val { font-family: var(--f-mono); font-weight: 600; color: var(--ink); }

  .chart-wrap { padding: 0 14px; }
  .chart-wrap svg { display: block; width: 100%; height: auto; }

  .axis-text { font-family: 'IBM Plex Mono', monospace; font-size: 11px; fill: #8b939c; }
  .grid-line { stroke: rgba(232, 234, 237, 0.07); stroke-width: 1; }
  .axis-line { stroke: #22262b; stroke-width: 1; }

  .eq-line { fill: none; stroke: var(--copper); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .bm-line { fill: none; stroke: var(--benchmark); stroke-width: 1.6; stroke-dasharray: 5 4; stroke-linejoin: round; opacity: 0.9; }
  .dd-line { fill: none; stroke: var(--bear); stroke-width: 1.4; stroke-linejoin: round; }

  .chart-note {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 22px 18px;
    font-size: 0.78rem;
    color: var(--ink-3);
  }
  .chart-note svg { width: 14px; height: 14px; stroke: currentColor; stroke-width: 1.8; flex-shrink: 0; }

  /* ================= DETAIL METRIC GRID ================= */
  .metric-groups {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
  }
  .metric-group { padding: 20px 22px; border-right: 1px solid var(--line); }
  .metric-group:last-child { border-right: none; }

  .metric-group-title {
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-3);
    padding-bottom: 10px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 4px;
  }

  .metric {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    padding: 9px 0;
    border-bottom: 1px solid var(--line);
  }
  .metric:last-child { border-bottom: none; }
  .metric-label { font-size: 0.82rem; color: var(--ink-2); }
  .metric-value {
    font-family: var(--f-mono);
    font-size: 0.86rem;
    font-weight: 600;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .metric-value.empty { color: var(--ink-3); font-weight: 500; }

  /* ================= DIAGNOSTICS · 3 STATES ================= */
  .diag-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
  }
  .diag { display: flex; flex-direction: column; min-height: 268px; }
  .diag .card-head { padding: 16px 18px; }
  .diag .card-body { padding: 18px; flex: 1; display: flex; flex-direction: column; }

  /* skeleton */
  .sk {
    background: linear-gradient(90deg, var(--card-2) 0%, var(--card-3) 50%, var(--card-2) 100%);
    background-size: 220% 100%;
    border-radius: var(--r);
    animation: shimmer 1.5s linear infinite;
  }
  @keyframes shimmer { from { background-position: 140% 0; } to { background-position: -40% 0; } }

  .sk-bars { display: flex; align-items: flex-end; gap: 8px; height: 132px; margin-bottom: 14px; }
  .sk-bars > span { flex: 1; border-radius: var(--r); }
  .sk-line { height: 10px; margin-top: 8px; }

  .state-note {
    display: flex;
    align-items: center;
    gap: 7px;
    margin-top: auto;
    padding-top: 12px;
    font-size: 0.78rem;
    color: var(--ink-3);
  }
  .state-note svg { width: 14px; height: 14px; stroke: currentColor; stroke-width: 1.8; flex-shrink: 0; }

  /* error */
  .state-box {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 8px;
    padding: 18px 10px;
    border: 1px dashed var(--line-2);
    border-radius: var(--r);
    background: var(--bg-alt);
  }
  .state-box.failed { border-color: rgba(229, 169, 61, 0.4); background: var(--warn-soft); }

  .state-icon {
    width: 38px;
    height: 38px;
    border-radius: var(--r);
    display: grid;
    place-items: center;
    background: var(--card-2);
    border: 1px solid var(--line-2);
    color: var(--ink-3);
    margin-bottom: 2px;
  }
  .state-icon.failed { background: var(--warn-soft); border-color: rgba(229, 169, 61, 0.4); color: var(--warn); }
  .state-icon svg { width: 18px; height: 18px; stroke: currentColor; stroke-width: 1.8; }

  .state-title { font-size: 0.9rem; font-weight: 600; color: var(--ink); }
  .state-body { font-size: 0.8rem; color: var(--ink-3); max-width: 34ch; }
  .state-code { font-family: var(--f-mono); font-size: 0.72rem; color: var(--warn); }

  /* ================= TRADES TABLE ================= */
  .toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .input, .select {
    height: 38px;
    padding: 0 12px;
    background: var(--card-2);
    border: 1px solid var(--line);
    border-radius: var(--r);
    color: var(--ink);
    font-size: 0.82rem;
    /* outline:none 제거 — L118 :focus-visible 이 소스 순서에 밀려 키보드 포커스가 죽던 문제 */
    transition: border-color var(--dur) var(--ease);
  }
  .input { width: 220px; }
  .input::placeholder { color: var(--ink-3); }
  .input:hover, .select:hover { border-color: var(--line-2); }
  .select { appearance: none; padding-right: 30px;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%238b939c' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
    background-repeat: no-repeat;
    background-position: right 10px center;
  }

  .table-wrap { overflow-x: auto; }
  table.trades { width: 100%; min-width: 940px; border-collapse: collapse; }

  table.trades thead th {
    position: sticky;
    top: 0;
    background: var(--card-2);
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-3);
    text-align: left;
    padding: 11px 14px;
    border-bottom: 1px solid var(--line);
    white-space: nowrap;
  }
  table.trades thead th.num { text-align: right; }
  table.trades thead th:first-child { padding-left: 22px; }
  table.trades thead th:last-child { padding-right: 22px; }

  table.trades tbody td {
    padding: 12px 14px;
    border-bottom: 1px solid var(--line);
    font-size: 0.82rem;
    white-space: nowrap;
    color: var(--ink-2);
  }
  table.trades tbody td.mono-l {
    text-align: left;
    font-family: var(--f-mono);
    font-variant-numeric: tabular-nums;
    color: var(--ink-2);
  }
  table.trades tbody td.num {
    text-align: right;
    font-family: var(--f-mono);
    font-variant-numeric: tabular-nums;
    color: var(--ink);
  }
  table.trades tbody td:first-child { padding-left: 22px; }
  table.trades tbody td:last-child { padding-right: 22px; }
  table.trades tbody tr { transition: background var(--dur) var(--ease); }
  table.trades tbody tr:hover { background: var(--card-2); }
  table.trades tbody tr:last-child td { border-bottom: none; }

  .side {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    height: 22px;
    padding: 0 10px;
    border-radius: var(--r);
    font-size: 0.72rem;
    font-weight: 700;
    font-family: var(--f-mono);
  }
  .side.long { background: var(--bull-soft); color: var(--bull); }
  .side.short { background: var(--bear-soft); color: var(--bear); }

  .pager {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    padding: 14px 22px;
    border-top: 1px solid var(--line);
    font-size: 0.8rem;
    color: var(--ink-3);
  }
  .pager-nums { display: inline-flex; gap: 4px; }
  .pg {
    min-width: 34px;
    height: 34px;
    padding: 0 9px;
    border-radius: var(--r);
    border: 1px solid var(--line);
    background: var(--card-2);
    color: var(--ink-2);
    font-family: var(--f-mono);
    font-size: 0.78rem;
    font-weight: 600;
    transition: background var(--dur) var(--ease), color var(--dur) var(--ease);
  }
  .pg:hover { background: var(--card-3); color: var(--ink); }
  .pg.active { background: var(--copper); border-color: var(--copper); color: var(--copper-ink); }

  /* ================= TRUST PANEL ================= */
  .trust-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .trust-col { padding: 18px 22px; }
  .trust-col:first-child { border-right: 1px solid var(--line); }

  .trust-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 14px;
    padding: 8px 0;
    border-bottom: 1px solid var(--line);
  }
  .trust-row:last-child { border-bottom: none; }
  .trust-key { font-size: 0.82rem; color: var(--ink-2); }
  .trust-val { font-family: var(--f-mono); font-size: 0.8rem; color: var(--ink); text-align: right; }

  .disclaimer {
    display: flex;
    gap: 10px;
    padding: 14px 22px;
    border-top: 1px solid var(--line);
    background: var(--bg-alt);
    border-radius: 0 0 var(--r) var(--r);
    font-size: 0.8rem;
    color: var(--ink-3);
    line-height: 1.6;
  }
  .disclaimer svg { width: 15px; height: 15px; stroke: var(--ink-3); stroke-width: 1.8; flex-shrink: 0; margin-top: 2px; }

  /* ================= NEXT STEP CTA ================= */
  .cta-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }

  .cta {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 20px;
  }
  .cta:hover { box-shadow: var(--shadow-hi); border-color: var(--line-2); transform: translateY(-2px); }
  .cta.recommended { border-color: var(--copper-line); }

  .cta-badge {
    align-self: flex-start;
    font-family: var(--f-mono);
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--copper);
    background: var(--copper-soft);
    border: 1px solid var(--copper-line);
    border-radius: var(--r);
    padding: 2px 8px;
  }
  .cta-icon {
    width: 38px;
    height: 38px;
    border-radius: var(--r);
    display: grid;
    place-items: center;
    background: var(--card-2);
    border: 1px solid var(--line);
    color: var(--ink-2);
  }
  .cta.recommended .cta-icon { background: var(--copper-soft); border-color: var(--copper-line); color: var(--copper); }
  .cta-icon svg { width: 18px; height: 18px; stroke: currentColor; stroke-width: 1.8; }

  .cta-title { font-family: var(--f-display); font-size: 1rem; font-weight: 700; letter-spacing: -0.01em; }
  .cta-desc { font-size: 0.82rem; color: var(--ink-3); line-height: 1.55; }
  .cta-meta { font-family: var(--f-mono); font-size: 0.74rem; color: var(--ink-3); }
  .cta .btn { margin-top: auto; }

  /* ================= FOOTER ================= */
  .foot {
    margin-top: 32px;
    padding-top: 18px;
    border-top: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    font-family: var(--f-mono);
    font-size: 0.74rem;
    color: var(--ink-3);
  }

  /* ================= TOAST ================= */
  .toast {
    position: fixed;
    right: 20px;
    bottom: 20px;
    max-width: 340px;
    padding: 12px 14px;
    background: var(--card-2);
    border: 1px solid var(--line-2);
    border-radius: var(--r);
    box-shadow: var(--shadow-hi);
    font-size: 0.8rem;
    color: var(--ink-2);
    line-height: 1.5;
    opacity: 0;
    transform: translateY(8px);
    pointer-events: none;
    transition: opacity var(--dur) var(--ease), transform var(--dur) var(--ease);
    z-index: 200;
  }
  .toast.show { opacity: 1; transform: translateY(0); }

  /* ================= MOTION ================= */
  .rise { animation: rise 520ms var(--ease) both; }
  .d1 { animation-delay: 40ms; }
  .d2 { animation-delay: 90ms; }
  .d3 { animation-delay: 140ms; }
  .d4 { animation-delay: 190ms; }
  .d5 { animation-delay: 240ms; }
  .d6 { animation-delay: 290ms; }
  .d7 { animation-delay: 340ms; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  .draw { stroke-dasharray: 2600; stroke-dashoffset: 2600; animation: draw 1400ms var(--ease) 180ms forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
    }
    .rise { animation: none; opacity: 1; transform: none; }
    .draw { stroke-dasharray: none; stroke-dashoffset: 0; animation: none; }
    .sk { animation: none; background: var(--card-2); }
  }

  /* ================= RESPONSIVE ================= */
  @media (max-width: 1200px) {
    .kpi-row { grid-template-columns: repeat(2, 1fr); }
    .metric-groups { grid-template-columns: repeat(2, 1fr); }
    .metric-group:nth-child(2) { border-right: none; }
    .metric-group:nth-child(1), .metric-group:nth-child(2) { border-bottom: 1px solid var(--line); }
    .diag-row { grid-template-columns: 1fr 1fr; }
    .diag-row > *:nth-child(3) { grid-column: 1 / -1; }
    .cta-row { grid-template-columns: 1fr; }
  }

  @media (max-width: 1024px) {
    :root { --sidebar-w: 64px; }
    .brand { justify-content: center; padding: 0; }
    .brand-name, .nav-group-label, .account-name, .account-sub, .nav-count { display: none; }
    .nav-item { justify-content: center; padding: 8px; }
    .nav-item .label { display: none; }
    .account { justify-content: center; padding: 8px; }
    .searchbox { display: none; }
  }

  @media (max-width: 768px) {
    :root { --sidebar-w: 0px; }
    .sidebar { display: none; }
    .main, .topbar { margin-left: 0; }
    .topbar { padding: 0 14px; }
    .hamburger { display: grid; }
    .crumbs a, .crumbs .sep { display: none; }
    .page { padding: 18px 14px 48px; }
    .kpi-row { grid-template-columns: 1fr; }
    .metric-groups { grid-template-columns: 1fr; }
    .metric-group { border-right: none; border-bottom: 1px solid var(--line); }
    .metric-group:last-child { border-bottom: none; }
    .diag-row { grid-template-columns: 1fr; }
    .diag-row > *:nth-child(3) { grid-column: auto; }
    .trust-grid { grid-template-columns: 1fr; }
    .trust-col:first-child { border-right: none; border-bottom: 1px solid var(--line); }
    .report-title { font-size: 1.3rem; }
    .input { width: 100%; }
    .toolbar { width: 100%; }
  }

  /* ==========================================================
     PAGE-SPECIFIC — 화면 고유 CSS 는 여기부터. 위쪽 토큰/컴포넌트는 건드리지 않는다.
     새 규칙도 border-radius 는 var(--r) 하나만 쓴다.
     ========================================================== */

</style>
</head>

<script>
  // 탭 전환 (표시용)
  document.querySelectorAll('.tabs .tab').forEach(function (tab) {
    tab.addEventListener('click', function () {
      document.querySelectorAll('.tabs .tab').forEach(function (t) {
        t.classList.remove('active');
        t.setAttribute('aria-selected', 'false');
      });
      tab.classList.add('active');
      tab.setAttribute('aria-selected', 'true');
    });
  });

  // 테마 토글 — 이 프로토타입은 다크 고정이라는 사실을 그대로 알린다.
  var toast = document.getElementById('toast');
  var toastTimer = null;
  function say(message) {
    toast.textContent = message;
    toast.classList.add('show');
    window.clearTimeout(toastTimer);
    toastTimer = window.setTimeout(function () { toast.classList.remove('show'); }, 4200);
  }
  document.getElementById('themeToggle').addEventListener('click', function () {
    say('이 프로토타입은 다크 테마로 고정되어 있습니다. 라이트는 globals.css 의 :root 쿨 페이퍼 토큰 세트로 교체하면 같은 레이아웃 그대로 전환됩니다.');
  });
</script>
