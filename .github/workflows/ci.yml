# ADR-037 제로베이스: CI = 표준 러너 단일 게이트, 이전 판 = git show harness-v1:.github/workflows/ci.yml
#
# 남긴 것: backend(ruff + pytest 전량) · frontend(biome + tsc + vitest + next build).
#   ★frontend 의 `pnpm lint` 는 2026-08-22 부터 **Biome 단독**이다([ADR-039]) — prettier·ESLint 제거.
# 지운 것: paths-filter/changes · documentation · secret_scan · e2e/e2e_authed ·
#   pytest 샤딩 · coverage 래칫 · alembic 스텝 · OpenAPI drift · mypy · 집계(summary) 잡 ·
#   rules-of-hooks eslint-disable 차단 grep(LESSON-004 보조 방어선 — 2026-08-22 [ADR-039] 로
#   ESLint 자체가 없어졌다. 그 축의 잔여 방어선은 Biome 의 `useHookAtTopLevel` ·
#   `useExhaustiveDependencies` 와 /review-code conventions 차원이다. `set-state-in-effect` 는
#   **대체물이 없어 사람이 지킨다** — ADR-039 「무엇을 잃었나」 참조).
# 하네스 재추가는 「문서화된 사고 1건 = 슬림 복귀 1건」 규칙만 허용한다.
#
# ★★★2026-08-26 재입힘 1건 — `changes` 잡(경로 스코프 판정)을 되돌렸다.
#   위 「지운 것」 목록의 paths-filter/changes 축이다. 근거는 추측이 아니라 실측이다:
#   최근 머지 PR 30건 중 **문서만 9건(30%)** · BE만 11건(37%) · FE만 3건(10%) 이고,
#   BE 잡 ~13분 · FE 잡 ~4분 기준 **30 PR 당 약 236분**이 검증 대상 없는 잡에 들어갔다.
#   복귀는 최소판이다 — 판정 로직은 `tools/scripts/ci-changed-scopes.sh` 하나이고,
#   그 파일의 판정은 `apps/api/tests/scripts/test_ci_changed_scopes.py` 가 지킨다.
#   ★종전 판과 다른 점 = **`on.paths` 를 쓰지 않는다.** 그러면 워크플로가 아예 안 돌아
#   required check 가 영구 대기한다(아래 merge_group 주석과 같은 함정). 잡은 항상
#   생성되고 `if:` 로 skip 된다 — skip 은 branch protection 이 성공으로 친다.
#   ★fail-safe: diff 취득 실패 · 빈 diff · **분류 안 되는 경로 1건** 이면 전량 실행.
#
# tombstone(2026-08-21) — `.gitleaks.toml` 삭제. secret_scan 잡이 위에서 철거되면서 그 설정을
#   읽는 곳이 0 이 됐다(훅·스크립트 포함 전수 grep 0건). 원문 = `git show 29176d1e:.gitleaks.toml`
#   (값 단위 allowlist 4건 + 「왜 안전한가」 주석). 재입힘 시 그 파일을 되살리고 `gitleaks dir`
#   잡 1개만 추가하면 된다 — 판별력 증명 4종은 [BL-757](docs/backlog-resolved.md)에 남아 있다.

name: CI

on:
  pull_request:
    # stage/** — 대형 작업의 웨이브 PR(base=stage/<theme>)에도 CI 발화
    branches: [main, "stage/**"]
  # merge queue 를 켜는 날을 위한 선배선 — 이 트리거가 없으면 큐의 합성 커밋에 check 가
  # 아예 생성되지 않아 required check 가 영구 대기한다(ci-cd.md 에 기록된 함정).
  merge_group:
  # main 을 손으로 확인해야 할 때의 안전판. 상시 트리거는 아니다.
  workflow_dispatch:

# 두 잡 다 코드 읽기만 한다 — PR API 를 쓰는 스텝이 없으므로 contents 하나로 족하다.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 무엇을 돌릴지 정한다. 이 잡 자신은 항상 돈다(30초) — 판정의 근거를 로그로 남기는 것이
  # 이 잡의 두 번째 일이다. 「돌았다고 여겼는데 안 돌았다」를 두 번 겪은 레포다.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.classify.outputs.backend }}
      frontend: ${{ steps.classify.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          # base..head diff 를 뜨려면 전체 히스토리가 필요하다.
          fetch-depth: 0
      - id: classify
        # PR 이 아닌 트리거(merge_group·workflow_dispatch)는 base sha 가 없다 →
        # 스크립트가 fail-safe 로 전량 실행을 낸다. 그것이 의도다.
        run: |
          bash tools/scripts/ci-changed-scopes.sh \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}"

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    # 실측 12m20s (PR #687 첫 완주) — 행이 걸려도 기본 360분을 태우지 않게 상한을 건다.
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/api
    services:
      db:
        image: timescale/timescaledb:2.14.2-pg15
        env:
          POSTGRES_USER: quantbridge
          POSTGRES_PASSWORD: password
          POSTGRES_DB: quantbridge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quantbridge"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      # 도구 버전(python·uv)은 루트 mise.toml 하나가 정한다 (ADR-036) — CI 에 숫자를 적지 않는다.
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      - uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('apps/api/uv.lock') }}
          restore-keys: uv-${{ runner.os }}-
      # --frozen: uv.lock 과 pyproject 가 어긋나면 재해석하지 않고 죽는다 — FE 의
      # --frozen-lockfile 과 같은 재현성 단언(비대칭 해소).
      - run: uv sync --all-extras --dev --frozen
      - run: uv run ruff check .
      # pytest 전량 — 샤딩·coverage 계측 없이 한 번에 돈다. 스키마는 tests/conftest.py 가
      # drop_all + create_all 로 세우므로 alembic 스텝은 전제가 아니다.
      # env 는 harness-v1 pytest 스텝을 그대로 이어받았다:
      #   - TEST_DATABASE_URL 은 의무다 — tests/_db_guard.py 가 DATABASE_URL 폴백을 거부한다(rc=3).
      #   - celery 3종은 Settings 기본값이 compose 서비스명이라 러너에서 해석되지 않는다 —
      #     REDIS_URL 만으로는 부족하다(broker/result/lock 은 별도 설정, core/config.py).
      - run: uv run pytest
        env:
          DATABASE_URL: postgresql+asyncpg://quantbridge:password@localhost:5432/quantbridge_test
          TEST_DATABASE_URL: postgresql+asyncpg://quantbridge:password@localhost:5432/quantbridge_test
          REDIS_URL: redis://localhost:6379/0
          CELERY_BROKER_URL: redis://localhost:6379/1
          CELERY_RESULT_BACKEND: redis://localhost:6379/2
          REDIS_LOCK_URL: redis://localhost:6379/3
          TRADING_ENCRYPTION_KEYS: "MiqlMqTkIxWclJ-STQ7t6BUyYlh4qnhminJHXUJJouc="

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    # 실측 3m42s (PR #687 첫 완주).
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      # 도구 버전(node·pnpm)은 루트 mise.toml 하나가 정한다 (ADR-036).
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      - id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('apps/web/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm tsc --noEmit
      - run: pnpm test -- --run
      # Better Auth 는 부팅 시점에만 필요하고 빌드에는 관여하지 않는다.
      # 값이 없으면 개발 기본값으로 뜬다(production 에서만 throw).
      - run: pnpm build
        env:
          BETTER_AUTH_SECRET: ci-build-only-placeholder-secret-000000
          BETTER_AUTH_URL: http://localhost:3000
