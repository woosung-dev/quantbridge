name: Live Dev Smoke (frontend hooks diff)

# Sprint 31-D BL-157 — PR pre-merge live dev smoke gate.
#
# 배경: Sprint 30-β PR #120 (lightweight-charts 도입) 이 vitest mock 만 검증, dev
# server 라이브 5분 smoke 누락 → main 머지 후 사용자 dogfood 즉시 발현
# (`Cannot parse color: currentcolor` → AttributionLogoWidget throw → 결과 페이지
# ErrorBoundary fallback). hot-fix `edcfaa0` PR #124 회복.
#
# LESSON-004 PR 규약 ("hooks diff 가 있는 PR 은 dev server live smoke 5분 이상 필수")
# 자동화 — frontend hooks/chart/widget 변경 PR 은 본 워크플로우 PASS 의무.

on:
  pull_request:
    # stage/** — 리디자인 등 대형 작업의 웨이브 PR(base=stage/<theme>)에도 발화
    branches: [main, "stage/**"]
    paths:
      - "apps/web/src/**/*.ts"
      - "apps/web/src/**/*.tsx"
      # css-only PR(디자인 토큰 globals.css 등)도 차트 crash 게이트 대상 — BL-157 계열
      - "apps/web/src/**/*.css"
      - "apps/web/package.json"
      - "apps/web/pnpm-lock.yaml"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: apps/web
    env:
      # ADR-034 — 인증이 self-host 로 오면서 외부 키가 필요 없어졌다(공개 라우트 전용 스모크).
      BETTER_AUTH_SECRET: ci-smoke-only-placeholder-secret-00000
      BETTER_AUTH_URL: http://localhost:3000
      # Backend 미실행 — React Query fetch fail 은 spec 안 expected pattern 으로 무시
      NEXT_PUBLIC_API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # webServer (playwright.config.ts) 가 자동으로 `pnpm dev` 띄우고
      # http://localhost:3000 ready 까지 240s 대기 — 별도 background 시작 불필요.
      - name: Run live smoke (chromium-live-smoke project)
        run: pnpm exec playwright test --project=chromium-live-smoke
      - name: Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: live-smoke-playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
