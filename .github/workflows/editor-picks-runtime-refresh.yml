name: Editor picks pinned ARM runtime refresh

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - tools/scripts/editor-picks-runtime-refresh.py
      - apps/api/src/strategy/pine_v2/**
      - .github/workflows/editor-picks-runtime-refresh.yml

permissions:
  contents: read

jobs:
  refresh:
    if: >-
      github.repository == 'woosung-dev/quantbridge' &&
      github.actor == github.repository_owner &&
      github.event.pull_request.user.login == github.repository_owner &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/editor-picks-comparison-20261024' &&
      github.event.pull_request.head.sha == vars.EDITOR_PICKS_RUNTIME_REFRESH_HEAD &&
      vars.EDITOR_PICKS_INPUT_URL != '' && vars.EDITOR_PICKS_INPUT_SHA256 != ''
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: editor-picks-runtime-${{ github.event.pull_request.head.sha }}
      cancel-in-progress: false
    env:
      INPUT_URL: ${{ vars.EDITOR_PICKS_INPUT_URL }}
      INPUT_SHA: ${{ vars.EDITOR_PICKS_INPUT_SHA256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518
        with:
          install_args: python uv
          cache: false
      - run: uv sync --project apps/api --frozen --no-dev
      - name: Download authenticated parent runtime input
        run: |
          python3 -c 'import os,re; assert os.environ["INPUT_URL"].startswith("https://github.com/woosung-dev/quantbridge/releases/download/editor-picks-research-20261024/") and re.fullmatch("[a-f0-9]{64}",os.environ["INPUT_SHA"])'
          curl --fail --location --retry 2 "$INPUT_URL" --output "$RUNNER_TEMP/parent.enc"
      - name: Authenticate and unpack parent input
        env:
          EDITOR_PICKS_RESEARCH_KEY: ${{ secrets.EDITOR_PICKS_RESEARCH_KEY }}
        run: |
          apps/api/.venv/bin/python -m tools.research.editor_picks.remote prepare \
            --run-dir runs/editor-picks-runtime-parent --cipher "$RUNNER_TEMP/parent.enc" \
            --archive "$RUNNER_TEMP/parent.tar.gz" --sha256 "$INPUT_SHA" \
            --key-env EDITOR_PICKS_RESEARCH_KEY
      - name: Load pinned parent images on disposable ARM
        run: >-
          apps/api/.venv/bin/python -m tools.research.editor_picks.remote runtime
          --run-dir runs/editor-picks-runtime-parent
      - name: Overlay changed Pine files and verify exported computation sources
        env:
          EDITOR_PICKS_RESEARCH_KEY: ${{ secrets.EDITOR_PICKS_RESEARCH_KEY }}
        run: |
          apps/api/.venv/bin/python tools/scripts/editor-picks-runtime-refresh.py \
            --run-dir runs/editor-picks-runtime-parent --output-dir runs/editor-picks-runtime-corrected \
            --archive "$RUNNER_TEMP/runtime.tar.gz" \
            --cipher "$RUNNER_TEMP/runtime-refresh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.enc" \
            --head "${{ github.event.pull_request.head.sha }}" --key-env EDITOR_PICKS_RESEARCH_KEY
      - name: Preserve ciphertext only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload editor-picks-research-20261024 \
            "$RUNNER_TEMP/runtime-refresh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.enc"
