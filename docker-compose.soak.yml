# 소크 전용 — 워커가 **작업 트리가 아니라 고정된 커밋 스냅샷**을 돈다 (BL-003 게이트)
#
# 사용법 (직접 부르지 마라 — scripts/soak-stack.sh 가 순서를 지킨다):
#   scripts/soak-stack.sh pin [<commitish>]   # .soak/src 스냅샷 생성 + 커밋 기록
#   scripts/soak-stack.sh up                  # 이 파일을 3번째 층으로 얹어 기동
#
# ★왜 필요한가 — `docker-compose.isolated.yml` 은 `./backend/src` 를 그대로 mount 하고
# celery 를 watchfiles 로 감싼다. 그래서 `backend/src` 를 한 줄만 고쳐도 소크 워커가
# 재적재된다(실측 105회). 08-01 이후 소크 종료 8건 중 6건이 `user_stopped` 였고, 그건
# 고장이 아니라 **사람이 코드 작업하려고 멈춘 것**이다. [BL-003] 의 게이트가 「데모 1주
# 안정 운영」이라는 달력 시간인데 그 시계가 개발과 물리적으로 배타적이었다.
#
# ★이 파일이 바꾸는 것은 두 키뿐이다:
#   volumes  — `./backend/src` → `./.soak/src` (git 커밋에서 뜬 읽기전용 스냅샷)
#   command  — watchfiles wrapper 제거 (base 의 맨 celery 로 되돌린다)
# 포트 재배치(5433/6380)는 isolated 층이 그대로 살린다. 그래서 **3층**이다:
#   -f docker-compose.yml -f docker-compose.isolated.yml -f docker-compose.soak.yml
#
# ★경로는 고정이다 — 변수화(`${QB_SRC_ROOT}`)가 아니다. 그 안은 2026-07-29 사용자 결정으로
# 이미 기각됐다(워크트리가 워커를 자기 src 로 돌리게 된다 —
# docs/reference/operations/worktree-parallel.md §2.1). 여기서 `.soak/src` 의 내용은
# **git 커밋에서만** 나오고 `scripts/assert-main-checkout.sh` 가 그대로 걸린다.
#
# ★`.soak/src` 가 없으면 기동하지 마라 — bind source 가 없으면 Docker 가 빈 디렉터리를
# 만들고 워커는 `src.tasks.celery_app` 을 못 찾아 조용히 죽는다. soak-stack.sh 가 막는다.

services:
  backend-worker:
    volumes: !override
      - ./.soak/src:/app/src:ro
      - ./backend/.metrics:/metrics
    command: !override
      - "uv"
      - "run"
      - "celery"
      - "-A"
      - "src.tasks.celery_app"
      - "worker"
      - "--loglevel=info"
      - "--pool=prefork"
      - "--concurrency=2"

  backend-ws-stream:
    volumes: !override
      - ./.soak/src:/app/src:ro
      - ./backend/.metrics:/metrics
    command: !override
      - "uv"
      - "run"
      - "celery"
      - "-A"
      - "src.tasks.celery_app"
      - "worker"
      - "--loglevel=info"
      - "--pool=prefork"
      - "--concurrency=3"
      - "--queues=ws_stream"

  backend-optimizer-heavy:
    volumes: !override
      - ./.soak/src:/app/src:ro
      - ./backend/.metrics:/metrics
    command: !override
      - "uv"
      - "run"
      - "celery"
      - "-A"
      - "src.tasks.celery_app"
      - "worker"
      - "-Q"
      - "optimizer_heavy"
      - "--pool=prefork"
      - "--concurrency=1"
      - "--loglevel=info"

  backend-beat:
    volumes: !override
      - ./.soak/src:/app/src:ro
      - ./backend/.metrics:/metrics
      - beat-data:/data
    command: !override
      - "uv"
      - "run"
      - "celery"
      - "-A"
      - "src.tasks.celery_app"
      - "beat"
      - "--loglevel=info"
      - "--schedule=/data/celerybeat-schedule"
